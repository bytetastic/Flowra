name: Flowra Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  ICON_ICO_B64: ""
  ICON_PNG_B64: ""

jobs:
  # ── Windows → Flowra.exe ──────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python-Pakete installieren
        run: pip install pyinstaller pywebview fastapi uvicorn pydantic aiofiles

      - name: Frontend bauen
        run: |
          cd frontend
          npm install
          npm run build

      - name: Flowra-Icon einbetten
        shell: python
        run: |
          import base64, os
          os.makedirs('backend/assets', exist_ok=True)
          open('backend/assets/icon.ico', 'wb').write(base64.b64decode(os.environ['ICON_ICO_B64'].strip()))
          print('[OK] icon.ico eingebettet')

      - name: Flowra.exe bauen
        run: |
          cd backend
          # Sicherheitsnetz: Kopiere flowra.spec zu flowra_windows.spec, falls alte Aufrufe hängen
          if (Test-Path "flowra.spec") { Copy-Item "flowra.spec" -Destination "flowra_windows.spec" }
          pyinstaller flowra.spec --distpath dist --workpath build_tmp --noconfirm

      - name: Prüfen ob .exe existiert
        shell: python
        run: |
          import os, sys
          if not os.path.exists('backend/dist/Flowra.exe'):
            print('FEHLER: Flowra.exe nicht gefunden!')
            sys.exit(1)
          size = os.path.getsize('backend/dist/Flowra.exe') / 1024 / 1024
          print(f'[OK] Flowra.exe ({size:.0f} MB)')

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Flowra-Windows
          path: backend/dist/Flowra.exe
          retention-days: 30

  # ── Linux → Flowra Binary ─────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: System-Pakete für pywebview installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Python-Pakete installieren
        run: pip install pyinstaller pywebview fastapi uvicorn pydantic aiofiles

      - name: Frontend bauen
        run: |
          cd frontend
          npm install
          npm run build

      - name: Flowra-Icon einbetten
        run: |
          mkdir -p backend/assets
          python3 -c "
          import base64, os
          open('backend/assets/icon.ico','wb').write(base64.b64decode(os.environ['ICON_ICO_B64'].strip()))
          print('[OK] icon.ico')
          "

      - name: Flowra Linux-Binary bauen
        run: |
          cd backend
          cp flowra.spec flowra_windows.spec 2>/dev/null || true
          pyinstaller flowra.spec --distpath dist --workpath build_tmp --noconfirm

      - name: Binary ausführbar machen
        run: chmod +x backend/dist/Flowra

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Flowra-Linux
          path: backend/dist/Flowra
          retention-days: 30

  # ── macOS → Flowra.app ────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python-Pakete installieren
        run: pip install pyinstaller pywebview fastapi uvicorn pydantic aiofiles Pillow

      - name: Frontend bauen
        run: |
          cd frontend
          npm install
          npm run build

      - name: Flowra-Icon als .icns einbetten
        run: |
          mkdir -p backend/assets
          python3 << 'PYEOF'
          import base64, os, subprocess
          from PIL import Image
          import io

          # PNG aus Base64
          png_data = base64.b64decode(os.environ['ICON_PNG_B64'].strip())
          img = Image.open(io.BytesIO(png_data)).convert("RGBA")

          # iconutil braucht ein .iconset Verzeichnis mit bestimmten Dateinamen
          iconset = '/tmp/Flowra.iconset'
          os.makedirs(iconset, exist_ok=True)

          for size in [16, 32, 64, 128, 256, 512]:
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f'{iconset}/icon_{size}x{size}.png')
              resized2 = img.resize((size*2, size*2), Image.LANCZOS)
              resized2.save(f'{iconset}/icon_{size}x{size}@2x.png')

          subprocess.run(['iconutil', '-c', 'icns', iconset, '-o', 'backend/assets/icon.icns'], check=True)

          # Auch ICO für PyInstaller spec
          open('backend/assets/icon.ico','wb').write(base64.b64decode(os.environ['ICON_ICO_B64'].strip()))
          print('[OK] icon.icns + icon.ico')
          PYEOF

      - name: macOS-Spec modifizieren (BUNDLE hinzufügen)
        run: |
          cd backend
          cat >> flowra.spec << 'SPECEOF'

          app = BUNDLE(exe,
              name='Flowra.app',
              icon='assets/icon.icns',
              bundle_identifier='com.flowra.app',
              info_plist={
                  'NSHighResolutionCapable': True,
                  'LSMinimumSystemVersion': '10.15',
              })
          SPECEOF

      - name: Flowra.app bauen
        run: |
          cd backend
          pyinstaller flowra.spec --distpath dist --workpath build_tmp --noconfirm

      - name: .app als ZIP verpacken
        run: |
          cd backend/dist
          zip -r Flowra-macOS.zip Flowra.app

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Flowra-macOS
          path: backend/dist/Flowra-macOS.zip
          retention-days: 30

  # ── Release erstellen ─────────────────────────────────
  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Windows-Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: Flowra-Windows
          path: release/windows

      - name: Linux-Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: Flowra-Linux
          path: release/linux

      - name: macOS-Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: Flowra-macOS
          path: release/macos

      - name: Linux-Binary ausführbar machen
        run: chmod +x release/linux/Flowra

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Flowra v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Flowra v${{ github.event.inputs.version }}

            ### Download
            | Datei | System | Hinweis |
            |---|---|---|
            | `Flowra.exe` | Windows | Einfach starten, kein Install nötig |
            | `Flowra` | Linux | `chmod +x Flowra` dann starten |
            | `Flowra-macOS.zip` | macOS | Entpacken, `Flowra.app` in Programme ziehen |
          files: |
            release/windows/Flowra.exe
            release/linux/Flowra
            release/macos/Flowra-macOS.zip