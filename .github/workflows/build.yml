name: Flowra Build

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  ICON_ICO_B64: ""
  ICON_PNG_B64: ""

jobs:

  # ── WINDOWS ──────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python-Pakete installieren
        run: pip install pyinstaller pywebview fastapi uvicorn pydantic aiofiles

      - name: Frontend bauen
        run: cd frontend && npm install && npm run build

      - name: Icon und Spec erstellen
        shell: python
        run: |
          import base64, os
          os.makedirs('backend/assets', exist_ok=True)
          open('backend/assets/icon.ico','wb').write(base64.b64decode(os.environ['ICON_ICO_B64']))
          spec = (
            '# -*- mode: python ; coding: utf-8 -*-\n'
            'from PyInstaller.utils.hooks import collect_data_files, collect_submodules\n'
            'import os\n'
            "frontend_build = os.path.join('..','frontend','build')\n"
            'a = Analysis(\n'
            "    ['main_desktop.py'],pathex=['.'],binaries=[],\n"
            "    datas=[(frontend_build,'frontend_build'),*collect_data_files('webview')],\n"
            '    hiddenimports=[\n'
            "        *collect_submodules('uvicorn'),*collect_submodules('fastapi'),\n"
            "        *collect_submodules('webview'),\n"
            "        'uvicorn.logging','uvicorn.loops','uvicorn.loops.auto',\n"
            "        'uvicorn.protocols','uvicorn.protocols.http',\n"
            "        'uvicorn.protocols.http.auto','uvicorn.lifespan',\n"
            "        'uvicorn.lifespan.on','anyio','anyio._backends._asyncio','sqlite3',\n"
            '    ],\n'
            "    excludes=['tkinter','matplotlib','numpy','pandas','PIL','pytest'],\n"
            '    noarchive=False,\n'
            ')\n'
            'pyz = PYZ(a.pure)\n'
            'exe = EXE(pyz,a.scripts,a.binaries,a.datas,[],\n'
            "    name='Flowra',debug=False,strip=False,\n"
            "    upx=True,console=False,icon='assets/icon.ico')\n"
          )
          open('backend/flowra_win.spec','w').write(spec)
          print('OK')

      - name: Flowra.exe bauen
        run: cd backend && pyinstaller flowra_win.spec --distpath dist --workpath build_tmp --noconfirm

      - name: Ergebnis prüfen
        shell: python
        run: |
          import os, sys
          f = 'backend/dist/Flowra.exe'
          if not os.path.exists(f):
            print('FEHLER: Flowra.exe fehlt!'); sys.exit(1)
          print(f"OK {os.path.getsize(f)//1024//1024} MB")

      - uses: actions/upload-artifact@v6
        with:
          name: Flowra-Windows
          path: backend/dist/Flowra.exe
          retention-days: 30

  # ── LINUX ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python-Pakete installieren
        run: pip install pyinstaller "pywebview[qt]" PyQt6 PyQt6-WebEngine fastapi uvicorn pydantic aiofiles

      - name: Frontend bauen
        run: cd frontend && npm install && npm run build

      - name: Icon und Spec erstellen
        run: |
          mkdir -p backend/assets
          python3 - << 'PYEOF'
          import base64, os
          open('backend/assets/icon.ico','wb').write(base64.b64decode(os.environ['ICON_ICO_B64']))
          spec = (
            '# -*- mode: python ; coding: utf-8 -*-\n'
            'from PyInstaller.utils.hooks import collect_data_files, collect_submodules\n'
            'import os\n'
            "frontend_build = os.path.join('..','frontend','build')\n"
            'a = Analysis(\n'
            "    ['main_desktop.py'],pathex=['.'],binaries=[],\n"
            "    datas=[(frontend_build,'frontend_build'),*collect_data_files('webview')],\n"
            '    hiddenimports=[\n'
            "        *collect_submodules('uvicorn'),*collect_submodules('fastapi'),\n"
            "        *collect_submodules('webview'),\n"
            "        'uvicorn.logging','uvicorn.loops','uvicorn.loops.auto',\n"
            "        'uvicorn.protocols','uvicorn.protocols.http',\n"
            "        'uvicorn.protocols.http.auto','uvicorn.lifespan',\n"
            "        'uvicorn.lifespan.on','anyio','anyio._backends._asyncio','sqlite3',\n"
            '    ],\n'
            "    excludes=['tkinter','matplotlib','numpy','pandas','PIL','pytest'],\n"
            '    noarchive=False,\n'
            ')\n'
            'pyz = PYZ(a.pure)\n'
            'exe = EXE(pyz,a.scripts,a.binaries,a.datas,[],\n'
            "    name='Flowra',debug=False,strip=False,upx=True,console=False)\n"
          )
          open('backend/flowra_linux.spec','w').write(spec)
          print('OK')
          PYEOF

      - name: Flowra Binary bauen
        run: cd backend && pyinstaller flowra_linux.spec --distpath dist --workpath build_tmp --noconfirm

      - run: chmod +x backend/dist/Flowra

      - uses: actions/upload-artifact@v6
        with:
          name: Flowra-Linux
          path: backend/dist/Flowra
          retention-days: 30

  # ── MACOS ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python-Pakete installieren
        run: pip install pyinstaller pywebview fastapi uvicorn pydantic aiofiles Pillow

      - name: Frontend bauen
        run: cd frontend && npm install && npm run build

      - name: Icon als .icns einbetten
        run: |
          mkdir -p backend/assets
          python3 - << 'PYEOF'
          import base64, os, subprocess, io
          from PIL import Image
          img = Image.open(io.BytesIO(base64.b64decode(os.environ['ICON_PNG_B64']))).convert('RGBA')
          iconset = '/tmp/Flowra.iconset'
          os.makedirs(iconset, exist_ok=True)
          for size in [16,32,64,128,256,512]:
              img.resize((size,size),     Image.LANCZOS).save(f'{iconset}/icon_{size}x{size}.png')
              img.resize((size*2,size*2), Image.LANCZOS).save(f'{iconset}/icon_{size}x{size}@2x.png')
          subprocess.run(['iconutil','-c','icns',iconset,'-o','backend/assets/icon.icns'],check=True)
          open('backend/assets/icon.ico','wb').write(base64.b64decode(os.environ['ICON_ICO_B64']))
          print('OK')
          PYEOF

      - name: macOS-Spec erstellen
        run: |
          python3 - << 'PYEOF'
          spec = (
            '# -*- mode: python ; coding: utf-8 -*-\n'
            'from PyInstaller.utils.hooks import collect_data_files, collect_submodules\n'
            'import os\n'
            "frontend_build = os.path.join('..','frontend','build')\n"
            'a = Analysis(\n'
            "    ['main_desktop.py'],pathex=['.'],binaries=[],\n"
            "    datas=[(frontend_build,'frontend_build'),*collect_data_files('webview')],\n"
            '    hiddenimports=[\n'
            "        *collect_submodules('uvicorn'),*collect_submodules('fastapi'),\n"
            "        *collect_submodules('webview'),\n"
            "        'uvicorn.logging','uvicorn.loops','uvicorn.loops.auto',\n"
            "        'uvicorn.protocols','uvicorn.protocols.http',\n"
            "        'uvicorn.protocols.http.auto','uvicorn.lifespan',\n"
            "        'uvicorn.lifespan.on','anyio','anyio._backends._asyncio','sqlite3',\n"
            '    ],\n'
            "    excludes=['tkinter','matplotlib','numpy','pandas','PIL','pytest'],\n"
            '    noarchive=False,\n'
            ')\n'
            'pyz = PYZ(a.pure)\n'
            'exe = EXE(pyz,a.scripts,a.binaries,a.datas,[],\n'
            "    name='Flowra',debug=False,strip=False,upx=False,console=False)\n"
            'app = BUNDLE(exe,\n'
            "    name='Flowra.app',\n"
            "    icon='assets/icon.icns',\n"
            "    bundle_identifier='com.flowra.app',\n"
            '    info_plist={\n'
            "        'NSHighResolutionCapable':True,\n"
            "        'LSMinimumSystemVersion':'10.15',\n"
            '    })\n'
          )
          open('backend/flowra_macos.spec','w').write(spec)
          print('OK')
          PYEOF

      - name: Flowra.app bauen
        run: cd backend && pyinstaller flowra_macos.spec --distpath dist --workpath build_tmp --noconfirm

      - name: ZIP erstellen
        run: cd backend/dist && zip -r Flowra-macOS.zip Flowra.app

      - uses: actions/upload-artifact@v6
        with:
          name: Flowra-macOS
          path: backend/dist/Flowra-macOS.zip
          retention-days: 30

  # ── RELEASE ───────────────────────────────────────────
  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Flowra-Windows
          path: release/windows

      - uses: actions/download-artifact@v4
        with:
          name: Flowra-Linux
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: Flowra-macOS
          path: release/macos

      - run: chmod +x release/linux/Flowra

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Flowra v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Flowra v${{ github.event.inputs.version }}

            | Datei | System | Hinweis |
            |---|---|---|
            | `Flowra.exe` | Windows | Einfach starten, kein Install nötig |
            | `Flowra` | Linux | Einfach starten, kein Install nötig |
            | `Flowra-macOS.zip` | macOS | Entpacken, Flowra.app in Programme ziehen |

            Die Datenbank `flowra.db` wird beim ersten Start neben der Datei erstellt.
          files: |
            release/windows/Flowra.exe
            release/linux/Flowra
            release/macos/Flowra-macOS.zip